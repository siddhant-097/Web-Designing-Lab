<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form>
    <label>Name:</label>
    <input type="text"
           required
           minlength="3"
           maxlength="30"
           pattern="[A-Za-z ]+">

    <br><br>

    <label>Email:</label>
    <input type="email" required>

    <br><br>

    <label>Password:</label>
    <input type="password"
           required
           minlength="8"
           maxlength="20">

    <br><br>

    <label>Phone:</label>
    <input type="text"
           required
           pattern="[0-9]{10}"
           maxlength="10">

    <br><br>

    <button type="submit">Register</button>
</form>

</body>
</html>
