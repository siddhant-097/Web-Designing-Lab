<!DOCTYPE html>
<html>
<head>
    <title>Grid Form</title>

    <style>
        form {
            width: 600px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            padding: 8px;
        }

        button {
            grid-column: 1 / 3;
            padding: 10px;
        }
    </style>
</head>

<body>

<h2 align="center">Student Details</h2>

<form>

    <label>Name</label>
    <input type="text">

    <label>Email</label>
    <input type="email">

    <label>Course</label>
    <select>
        <option>BCA</option>
        <option>MCA</option>
    </select>

    <label>Phone</label>
    <input type="tel">

    <button type="submit">Submit</button>

</form>

</body>
</html>
