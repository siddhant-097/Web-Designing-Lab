<!DOCTYPE html>
<html>
<head>
    <title>Range Input</title>

    <style>
        form {
            width: 400px;
            margin: 50px auto;
        }

        input {
            margin: 10px;
        }
    </style>
</head>

<body>

<form>

    <h2>Product Settings</h2>

    <label>
        Volume:
        <input type="range" min="0" max="100" value="50">
        %
    </label>

    <br>

    <label>
        Quantity:
        <input type="number" min="1" max="100" value="1">
        units
    </label>

</form>

</body>
</html>
