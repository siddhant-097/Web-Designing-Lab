<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        .container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            margin: 40px auto;
        }

        .form,
        .location {
            flex: 1;
            padding: 25px;
            border: 1px solid #ccc;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form">
        <h2>Contact Us</h2>

        <form>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <textarea rows="5" placeholder="Message"></textarea>

            <button type="submit">Send</button>
        </form>
    </div>

    <div class="location">
        <h2>Our Location</h2>

        <p>ABC Company</p>
        <p>Roorkee, Uttarakhand</p>
        <p>Email: contact@example.com</p>
        <p>Phone: 9876543210</p>
    </div>

</div>

</body>
</html>
