<!DOCTYPE html>
<html>
<head>
    <title>Hidden Fields</title>
</head>

<body>

<h2>User Form</h2>

<form action="/submit" method="post">

    <input type="hidden" name="session_id" value="ABC123">
    <input type="hidden" name="user_id" value="101">

    <label>Name:</label>
    <input type="text" name="name">

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
