<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>

    <style>
        form {
            width: 400px;
            margin: 50px auto;
        }

        input {
            margin: 10px 0;
        }

        button {
            padding: 10px 25px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #555;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<form>
    <h2>Upload Resume</h2>

    <input type="file" name="resume">

    <br>

    <button type="submit">Upload</button>
</form>

</body>
</html>
