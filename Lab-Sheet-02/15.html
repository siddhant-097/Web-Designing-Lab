<!DOCTYPE html>
<html>
<head>
    <title>Search Box</title>

    <style>
        .search {
            width: 200px;
            padding: 10px;
            border: 1px solid #999;
            transition: width 0.5s;
        }

        .search:focus {
            width: 400px;
            outline: none;
        }
    </style>
</head>

<body>

<h2>Search</h2>

<input
    type="text"
    class="search"
    placeholder="Search here...">

</body>
</html>
