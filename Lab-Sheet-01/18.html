<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1" cellpadding="8" cellspacing="0">
        <caption>Weekly Class Timetable</caption>
        <thead>
            <tr>
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>09:00 - 10:00</td>
                <td>Maths</td>
                <td>Science</td>
                <td>English</td>
                <td>Maths</td>
                <td>History</td>
            </tr>
            <tr>
                <td>10:00 - 11:00</td>
                <td>Physics</td>
                <td>Chemistry</td>
                <td>Biology</td>
                <td>English</td>
                <td>Geography</td>
            </tr>
            <tr>
                <td>11:00 - 12:00</td>
                <td colspan="5" align="center"><strong>Lunch Break</strong></td>
            </tr>
            <tr>
                <td>12:00 - 01:00</td>
                <td>Computer</td>
                <td>Art</td>
                <td>Sports</td>
                <td>Music</td>
                <td>Library</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
