<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <p>Choose your gender from the following: </p>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>
    
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other">
        <label for="other">Other</label>

        <p>Choose your hobbies</p>
        <input type="checkbox" name="hobbies" id="hobby1">
        <label for="hobby1">Basketball</label>

        <input type="checkbox" name="hobbies" id="hobby2">
        <label for="hobby2">Running</label>

        <input type="checkbox" name="hobbies" id="hobby3">
        <label for="hobby3">Coding</label>

        <input type="checkbox" name="hobbies" id="hobby4">
        <label for="hobby4">Chess</label>

        <input type="checkbox" name="hobbies" id="hobby5">
        <label for="hobby5">Movies & TV Shows</label>

    </form>
</body>
</html>
