<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Personal Details</legend>
            <label for="first name">First Name: </label>
            <input type="text" placeholder="Enter your first name" id="first name">
            <br>
            <br>

            <label for="last name">Last Name: </label>
            <input type="text" placeholder="Enter your last name" id="last name">
            <br>
            <br>

            <label for="email">Email: </label>
            <input type="text" placeholder="Enter your email"id="email">
            <br>
            <br>

            <label for="phone">Phone No.: </label>
            <input type="text" placeholder="Enter contact no." id="email">
            <br>
            <br>
        </fieldset>

        <fieldset>
            <legend>Course Selection</legend>
            <p>Select course you want to enroll in from the given list: </p>
            <select name="course" id="program">
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BBA">BBA</option>
                <option value="MBA">MBA</option>
            </select>
        </fieldset>
    </form>
</body>
</html>
